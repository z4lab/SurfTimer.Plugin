// These are settings you would like to enforce on the server. The plugin runs this file at every
// round start (execifexists SurfTimer/server_settings.cfg).

// Cheats on only while this file runs - bot_zombie / bot_stop / bot_freeze below are cheat cvars.
// Turned off again at the end of the file.
sv_cheats 1

// Timelimit - the match lasts mp_timelimit minutes. Rounds never end on their own
// (mp_ignore_round_win_conditions 1 below), so the round time only has to be longer than the match.
mp_timelimit 30
mp_maxrounds 0
mp_match_can_clinch 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_roundtime_hostage 60
mp_roundtime_deployment 0
mp_freezetime 0

// Match end - the end screen shows a vote for the next map from the workshop collection
// (host_workshop_collection), then the server changes to the winner. Keep the restart delay longer
// than the vote time.
mp_endmatch_votenextmap 1
mp_endmatch_votenextleveltime 20
mp_match_end_changelevel 1
mp_match_end_restart 0
mp_match_restart_delay 25

// Comms Settings
sv_alltalk 1
sv_deadtalk 1
sv_full_alltalk 1

// Movement Settings
sv_airaccelerate 150
// sv_airaccelerate 2000
sv_gravity 800
sv_friction 5.2
sv_maxspeed 350
sv_accelerate 10
sv_enablebunnyhopping 1
sv_autobunnyhopping 1
sv_staminajumpcost 0
sv_staminalandcost 0
sv_staminamax 0
sv_accelerate_use_weapon_speed 0
sv_timebetweenducks 0

// Some replay bot shit (took so fucking long to debug)
// bot_quota 1 No need for this, because the server handles it
bot_quota_mode "normal"
bot_join_after_player 1
bot_join_team CT
bot_zombie 1
bot_stop 1
bot_freeze 1

// Player Settings
mp_spectators_max 64
mp_humanteam any
mp_disconnect_kills_players 1
mp_solid_enemies 0
mp_solid_teammates 0
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1
mp_ct_default_secondary weapon_usp_silencer
mp_t_default_secondary weapon_usp_silencer
mp_limitteams 0
mp_autoteambalance 0
mp_playercashawards 0
mp_teamcashawards 0
mp_death_drop_c4 1
mp_death_drop_defuser 1
mp_death_drop_grenade 1
mp_death_drop_gun 1
mp_drop_knife_enable 1
mp_weapons_allow_map_placed 1
sv_falldamage_scale 0
mp_damage_scale_t_body 0
mp_damage_scale_t_head 0
mp_damage_scale_ct_body 0
mp_damage_scale_ct_head 0

// Server Settings
sv_allow_votes 0
mp_suicide_penalty 0
mp_friendlyfire 0
mp_ignore_round_win_conditions 1
mp_round_restart_delay 0
mp_warmuptime_all_players_connected 0
mp_team_intro_time 0
mp_warmup_end
mp_warmuptime 0
sv_holiday_mode 0
sv_party_mode 0

sv_cheats 0
